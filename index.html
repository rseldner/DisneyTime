<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disneyland Resort — 2-Day Itinerary · May 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #faf7f2;
    --warm-white: #fffef9;
    --ink: #1a1714;
    --ink-soft: #4a4440;
    --ink-muted: #8a837c;
    --border: rgba(26,23,20,0.10);
    --border-soft: rgba(26,23,20,0.06);
    --dl-color: #1a5276;
    --dl-bg: #eaf2fb;
    --dca-color: #5b2c6f;
    --dca-bg: #f0e8f5;
    --multi: #7d6608;
    --multi-bg: #fefdf0;
    --standby: #424949;
    --standby-bg: #f4f6f6;
    --food: #1e8449;
    --food-bg: #edfaf3;
    --tip: #5d6d7e;
    --radius: 10px;
    --radius-lg: 16px;
  }

  html, body { width: 100%; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ─────────────────────────────── */
  .site-header {
    background: var(--ink); color: #fff;
    padding: 2rem 1.5rem 1.6rem;
    text-align: center; position: relative; overflow: hidden;
  }
  .site-header::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 50%, rgba(26,82,118,0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(91,44,111,0.4) 0%, transparent 60%);
    pointer-events: none;
  }
  .site-header > * { position: relative; }
  .header-eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.5rem; }
  .header-title { font-family: 'DM Serif Display', Georgia, serif; font-size: clamp(1.6rem,5vw,2.8rem); font-weight: 400; line-height: 1.1; margin-bottom: 0.6rem; }
  .header-title em { font-style: italic; color: rgba(255,255,255,0.7); }
  .header-meta { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
  .header-pill { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.85); }
  .header-link { text-decoration: none; background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.28); transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .header-link:hover { background: rgba(255,255,255,0.24); border-color: rgba(255,255,255,0.42); color: #fff; }

  @media (max-width: 800px) {
    .site-header { padding: 0.75rem 1rem 0.8rem; }
    .header-eyebrow { display: none; }
    .header-title { font-size: 1.1rem; margin-bottom: 0.35rem; }
    .header-meta { gap: 0.3rem; margin-top: 0.35rem; }
    .header-pill { font-size: 10px; padding: 3px 9px; }
    .header-pill.hide-mobile { display: none; }
  }

  /* ── SHELL ───────────────────────────────── */
  .app-shell { display: flex; flex-direction: row; min-height: calc(100vh - 130px); width: 100%; }

  .sidebar {
    background: var(--warm-white); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    height: calc(100vh - 130px); position: sticky; top: 0; overflow: hidden;
    width: 370px; flex-shrink: 0; min-width: 200px; max-width: 70vw;
  }

  /* ── MAP ─────────────────────────────────── */
  #map-wrap { position: relative; flex-shrink: 0; border-bottom: 1px solid var(--border); }
  #map { height: 230px; min-height: 80px; }

  .map-toolbar {
    position: absolute; top: 7px; right: 7px; z-index: 800;
    display: flex; gap: 4px;
  }
  .map-btn {
    background: var(--warm-white); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px;
    font-size: 10px; font-weight: 700; cursor: pointer; color: var(--ink-soft);
    font-family: 'DM Sans', sans-serif; transition: all 0.15s; white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  .map-btn:hover { background: var(--cream); }
  .map-btn.active-all  { background: var(--dl-bg); color: var(--dl-color); border-color: var(--dl-border); }
  .map-btn.active-food { background: var(--food-bg); color: var(--food); border-color: var(--food); }
  .map-btn.active-route { background: #e8f0fe; color: #1a73e8; border-color: #1a73e8; }

  /* ── TABS ────────────────────────────────── */
  .day-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .day-tab {
    flex: 1; padding: 10px 8px; font-size: 11px; font-weight: 600;
    cursor: pointer; border: none; background: none; color: var(--ink-muted);
    transition: all 0.2s; letter-spacing: 0.02em;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    font-family: 'DM Sans', sans-serif;
  }
  .day-tab:hover { color: var(--ink); background: var(--cream); }
  .day-tab.active-dl  { color: var(--dl-color);  border-bottom-color: var(--dl-color);  background: var(--dl-bg); }
  .day-tab.active-dca { color: var(--dca-color); border-bottom-color: var(--dca-color); background: var(--dca-bg); }
  .day-tab.active-food { color: var(--food); border-bottom-color: var(--food); background: var(--food-bg); }

  /* ── STATS ───────────────────────────────── */
  .stats-bar { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .stat-cell { padding: 8px 4px; text-align: center; background: var(--warm-white); }
  .stat-cell .num { font-size: 16px; font-weight: 600; line-height: 1; }
  .stat-cell .lbl { font-size: 9px; color: var(--ink-muted); margin-top: 2px; letter-spacing: 0.02em; line-height: 1.3; }
  .stat-cell.dl  .num { color: var(--dl-color); }
  .stat-cell.dca .num { color: var(--dca-color); }

  /* ── TIMELINE ────────────────────────────── */
  .timeline-scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  .timeline-scroll::-webkit-scrollbar { width: 3px; }
  .timeline-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .section-label { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); padding: 10px 14px 3px; background: var(--cream); border-top: 1px solid var(--border-soft); }

  .t-item { display: flex; cursor: pointer; transition: background 0.15s; }
  .t-item:hover    { background: var(--cream); }
  .t-item.selected { background: #eef3fa; }

  .t-time { width: 52px; flex-shrink: 0; padding: 10px 6px 10px 10px; font-size: 10px; font-weight: 600; color: var(--ink-muted); text-align: right; line-height: 1.3; }
  .t-spine { width: 20px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
  .t-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 14px; flex-shrink: 0; border: 2px solid white; }
  .t-dot.multi   { background: var(--multi);   box-shadow: 0 0 0 1px var(--multi); }
  .t-dot.standby { background: var(--standby); box-shadow: 0 0 0 1px var(--standby); }
  .t-dot.food    { background: var(--food);    box-shadow: 0 0 0 1px var(--food); }
  .t-dot.tip     { background: var(--tip);     box-shadow: 0 0 0 1px var(--tip); }
  .t-line { width: 1px; background: var(--border); flex: 1; margin-top: 3px; }
  .t-body { flex: 1; padding: 9px 10px 9px 5px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: flex-start; min-width: 0; }
  .t-title { font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.3; margin-bottom: 3px; display: flex; align-items: flex-start; gap: 4px; flex-wrap: wrap; flex: 1; }
  .t-chevron { color: var(--ink-muted); font-size: 15px; line-height: 1; padding: 0 2px; align-self: center; flex-shrink: 0; }

  .badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 4px; letter-spacing: 0.03em; white-space: nowrap; flex-shrink: 0; }
  .badge.multi   { background: var(--multi-bg);   color: var(--multi); }
  .badge.standby { background: var(--standby-bg); color: var(--standby); }
  .badge.vegan   { background: var(--food-bg);    color: var(--food); }
  .badge.wait    { background: var(--cream); color: var(--ink-muted); border: 1px solid var(--border); }

  /* ── MAIN PANEL ──────────────────────────── */
  .main-panel { display: flex; flex-direction: column; background: var(--cream); }

  .legend-bar { display: flex; gap: 14px; flex-wrap: wrap; padding: 9px 20px; background: var(--warm-white); border-bottom: 1px solid var(--border); align-items: center; }
  .legend-bar-title { font-size: 9px; font-weight: 700; color: var(--ink-muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-soft); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .detail-panel { flex: 1; padding: 24px 28px; overflow-y: auto; }

  /* ── DETAIL CARD ─────────────────────────── */
  .detail-card { background: var(--warm-white); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(26,23,20,0.08); padding: 24px 28px; max-width: 560px; }
  .detail-eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px; }
  .detail-title { font-family: 'DM Serif Display', Georgia, serif; font-size: 1.5rem; font-weight: 400; line-height: 1.2; margin-bottom: 12px; }
  .detail-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .detail-badges .badge { font-size: 11px; padding: 3px 9px; }
  .detail-desc { font-size: 13px; color: var(--ink-soft); line-height: 1.8; border-top: 1px solid var(--border-soft); padding-top: 16px; }
  .detail-desc strong { color: var(--ink); font-weight: 600; }
  .mp-next-box { margin-top: 14px; padding: 10px 13px; background: var(--multi-bg); border-left: 3px solid var(--multi); border-radius: 0 6px 6px 0; font-size: 12px; color: var(--multi); font-weight: 600; line-height: 1.5; }
  .detail-meta { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-top: 18px; }
  .detail-meta-cell { background: var(--cream); border-radius: var(--radius); padding: 10px 12px; }
  .detail-meta-cell .label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted); margin-bottom: 3px; }
  .detail-meta-cell .value { font-size: 12px; font-weight: 500; color: var(--ink); }

  .type-multi.dl  .detail-title { color: var(--dl-color); }
  .type-multi.dca .detail-title { color: var(--dca-color); }
  .type-food      .detail-title { color: var(--food); }

  /* ── MOBILE ──────────────────────────────── */
  @media (max-width: 800px) {
    .app-shell { display: block; }
    .sidebar { width: 100%; min-width: 0; max-width: none; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); }
    .resize-h { display: none; }
    #map { height: 175px; }
    .timeline-scroll { max-height: 40vh; /* fallback — overridden by JS */ }
    .legend-bar { display: none; }
    .main-panel { display: block; }
    .detail-panel { padding: 0; min-height: 0; }

    .detail-sheet {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
      background: var(--warm-white); border-radius: 18px 18px 0 0;
      box-shadow: 0 -8px 40px rgba(26,23,20,0.2);
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
      max-height: 82vh; display: flex; flex-direction: column;
    }
    .detail-sheet.open { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; background: rgba(26,23,20,0.15); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
    .sheet-close { position: absolute; top: 10px; right: 14px; width: 28px; height: 28px; border-radius: 50%; background: var(--cream); border: none; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; color: var(--ink-muted); }
    .sheet-body { overflow-y: auto; padding: 6px 16px 36px; flex: 1; -webkit-overflow-scrolling: touch; }
    .detail-card { box-shadow: none; border: none; border-radius: 0; padding: 14px 2px 4px; max-width: 100%; background: transparent; }

    .sheet-backdrop { position: fixed; inset: 0; background: rgba(26,23,20,0.3); z-index: 9998; opacity: 0; pointer-events: none; transition: opacity 0.28s; }
    .sheet-backdrop.visible { opacity: 1; pointer-events: all; }
  }

  @media (min-width: 801px) {
    .detail-sheet, .sheet-backdrop { display: none !important; }
    .t-chevron { display: none; }
  }

  /* ── GEOLOCATION DOT ─────────────────────── */
  .geo-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: #1a73e8;
    border: 2.5px solid #fff;
    box-shadow: 0 1px 5px rgba(26,115,232,0.5);
  }
  .geo-pulse {
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(26,115,232,0.18);
    border: 1.5px solid rgba(26,115,232,0.4);
    animation: geo-ping 2s ease-out infinite;
  }
  @keyframes geo-ping {
    0%   { transform: scale(0.6); opacity: 1; }
    70%  { transform: scale(1.4); opacity: 0.2; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  /* ── FOOD GUIDE ──────────────────────────── */
  .food-guide-wrap { display: flex; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
  .food-guide-header { padding: 12px 20px 10px; background: var(--warm-white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .food-guide-header h2 { font-family: 'DM Serif Display', Georgia, serif; font-size: 1.25rem; font-weight: 400; color: var(--food); display: flex; align-items: center; gap: 8px; }
  .food-guide-badge { background: var(--food-bg); color: var(--food); font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
  .food-guide-sub { font-size: 10.5px; color: var(--ink-muted); margin-top: 3px; }

  .food-park-tabs { display: flex; gap: 5px; padding: 8px 14px; background: var(--warm-white); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .fp-tab { flex: 1; padding: 5px 8px; font-size: 10.5px; font-weight: 600; border: 1px solid var(--border); background: var(--cream); color: var(--ink-muted); border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .fp-tab:hover { background: #f0ede8; }
  .fp-tab.active-dl  { background: var(--dl-bg);  color: var(--dl-color);  border-color: var(--dl-color); }
  .fp-tab.active-dca { background: var(--dca-bg); color: var(--dca-color); border-color: var(--dca-color); }

  .food-guide-scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; min-height: 0; }
  .food-guide-scroll::-webkit-scrollbar { width: 3px; }
  .food-guide-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .fg-park-block { padding: 0 16px 20px; }
  .fg-park-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; padding: 12px 0 8px; border-bottom: 2px solid var(--border); margin-bottom: 12px; }
  .fg-park-title.dl  { color: var(--dl-color);  border-color: var(--dl-color); }
  .fg-park-title.dca { color: var(--dca-color); border-color: var(--dca-color); }

  .fg-land { margin-bottom: 14px; }
  .fg-land-name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); margin-bottom: 7px; padding-bottom: 4px; border-bottom: 1px solid var(--border-soft); }

  .fg-venue { background: var(--warm-white); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 7px; overflow: hidden; }
  .fg-venue-hdr { padding: 9px 11px 7px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 6px; user-select: none; }
  .fg-venue-hdr:hover { background: var(--cream); }
  .fg-venue-name { font-size: 12px; font-weight: 600; color: var(--ink); }
  .fg-venue-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .fg-venue-type { font-size: 9px; font-weight: 600; color: var(--ink-muted); background: var(--cream); padding: 2px 5px; border-radius: 3px; border: 1px solid var(--border); }
  .fg-chevron { font-size: 10px; color: var(--ink-muted); transition: transform 0.18s; flex-shrink: 0; }
  .fg-venue.open .fg-chevron { transform: rotate(180deg); }

  .fg-items { display: none; padding: 0 11px 9px; border-top: 1px solid var(--border-soft); }
  .fg-venue.open .fg-items { display: block; }

  .fg-item { display: flex; align-items: flex-start; gap: 7px; padding: 6px 0; border-bottom: 1px solid var(--border-soft); }
  .fg-item:last-child { border-bottom: none; }
  .fg-leaf { flex-shrink: 0; font-size: 11px; margin-top: 1px; }
  .fg-item-body { flex: 1; min-width: 0; }
  .fg-item-name { font-size: 11.5px; font-weight: 600; color: var(--ink); line-height: 1.35; }
  .fg-item-desc { font-size: 10.5px; color: var(--ink-muted); line-height: 1.5; margin-top: 2px; }
  .fg-price { font-size: 10px; font-weight: 600; color: var(--food); margin-left: 4px; }
  .tag-new    { display: inline-block; background: #edfaf3; color: var(--food); font-size: 8.5px; font-weight: 700; padding: 1px 4px; border-radius: 3px; border: 1px solid rgba(30,132,73,0.25); margin-left: 4px; vertical-align: middle; }
  .tag-out    { display: inline-block; background: #fdf2f2; color: #922b21; font-size: 8.5px; font-weight: 700; padding: 1px 4px; border-radius: 3px; border: 1px solid rgba(146,43,33,0.2); margin-left: 4px; vertical-align: middle; }
  .fg-venue-note { font-size: 10px; color: var(--ink-muted); padding: 5px 0 2px; font-style: italic; line-height: 1.5; }
  .fg-warn { font-size: 10px; color: #c0392b; font-weight: 600; margin-top: 3px; }


  /* ── RESIZE HANDLES ──────────────────────── */
  .resize-h {
    width: 6px; flex-shrink: 0; cursor: col-resize;
    background: var(--border);
    position: relative; z-index: 10; transition: background 0.15s;
  }
  .resize-h:hover, .resize-h.dragging { background: var(--dl-color); }
  .resize-h::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 2px; height: 40px; border-radius: 2px;
    background: rgba(255,255,255,0.6);
  }

  .resize-v {
    height: 6px; flex-shrink: 0; cursor: row-resize;
    background: var(--border); width: 100%;
    position: relative; z-index: 10; transition: background 0.15s;
  }
  .resize-v:hover, .resize-v.dragging { background: var(--dl-color); }
  .resize-v::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    height: 2px; width: 40px; border-radius: 2px;
    background: rgba(255,255,255,0.6);
  }

  .main-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--cream); }

</style>
</head>
<body>

<header class="site-header">
  <div class="header-eyebrow">Disneyland Resort &middot; 70th Anniversary Year</div>
  <h1 class="header-title">Two Days at <em>the Magic</em></h1>
  <div class="header-meta">
    <span class="header-pill">&#127984; Tue May 5 &mdash; Disneyland</span>
    <span class="header-pill">&#127905; Wed May 6 &mdash; DCA</span>
    <span class="header-pill hide-mobile">&#9889; Multi Pass</span>
    <span class="header-pill hide-mobile">&#127807; Vegan-Friendly</span>
    <a class="header-pill header-link" href="https://github.com/rseldner/DisneyTime" target="_blank" rel="noopener">Repo</a>
    <a class="header-pill header-link" href="https://gist.github.com/rseldner/8f5ea196bd5d492fe3489d4eb7a9a928" target="_blank" rel="noopener">MD Gist</a>
    <a class="header-pill header-link" href="https://gistpreview.github.io/?fdc8db89e1b6ea13f1df70d3aae39fbe" target="_blank" rel="noopener">HTML Gist</a>
  </div>
</header>

<div class="app-shell">
  <aside class="sidebar">
    <div id="map-wrap">
      <div id="map"></div>
      <div class="map-toolbar">
        <button class="map-btn active-all" id="btn-all"  onclick="setMapMode('all')">All stops</button>
        <button class="map-btn"            id="btn-food" onclick="setMapMode('food')">&#127807; Food</button>
        <button class="map-btn"            id="btn-locate" onclick="locateMe()" title="My location">&#128205;</button>
        <button class="map-btn"            id="btn-route" onclick="toggleRoute()" title="Show route to selected stop">Route</button>
      </div>
    </div>
    <div class="resize-v" id="resize-v" title="Drag to resize map"></div>
    <div class="day-tabs">

// ─── STATE ────────────────────────────────────────────────────────────────────
var currentDay = 'dl';
var currentView = 'day';
var currentIdx = null;
var map = null;
var allMarkers = []; // [{leaflet, idx, type}]
var mapMode = 'all';
var isMobile = false;
var routeEnabled = false;
var routeLine = null;

function checkMobile() { isMobile = window.innerWidth <= 800; }

// ─── MAP ──────────────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  map.setView(DAYS.dl.center, DAYS.dl.zoom);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, minZoom: 13, detectRetina: true,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  renderMarkers(currentDay);
}

function dotColor(type, day) {
  if (type === 'food')    return '#1e8449';
  if (type === 'multi')   return day === 'dl' ? '#1a5276' : '#5b2c6f';
  if (type === 'standby') return '#424949';
  return '#5d6d7e'; // tip
}

function makeIcon(color, selected) {
  var s = selected ? 14 : 10;
  var b = selected ? 3 : 2;
  var sh = selected
    ? '0 0 0 3px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.45)'
    : '0 1px 4px rgba(0,0,0,0.3)';
  return L.divIcon({
    className: '',
    html: '<div style="width:'+s+'px;height:'+s+'px;border-radius:50%;background:'+color+';border:'+b+'px solid white;box-shadow:'+sh+'"></div>',
    iconSize: [s,s], iconAnchor: [Math.ceil(s/2), Math.ceil(s/2)]
  });
}

function renderMarkers(day) {
  allMarkers.forEach(function(m){ map.removeLayer(m.leaflet); });
  allMarkers = [];

  var d = DAYS[day];
  d.items.forEach(function(item, idx) {
    if (!item.lat) return;
    if (mapMode === 'food' && item.type !== 'food') return;

    var color = dotColor(item.type, day);
    var sel = idx === currentIdx;
    var mk = L.marker([item.lat, item.lng], { icon: makeIcon(color, sel) }).addTo(map);

    mk.bindPopup(
      '<div style="font-family:sans-serif;font-size:11px"><strong style="color:'+color+'">' + item.title + '</strong><br><span style="color:#888;font-size:10px">' + item.time + '</span></div>',
      { offset: [0,-5], closeButton: false, maxWidth: 180 }
    );

    if (sel) mk.openPopup();

    mk.on('click', function(){ selectItem(idx); });
    allMarkers.push({ leaflet: mk, idx: idx, type: item.type });
  });
}

function highlightMarker(idx) {
  var d = DAYS[currentDay];
  allMarkers.forEach(function(m){
    var item = d.items[m.idx];
    if (!item) return;
    var color = dotColor(item.type, currentDay);
    var sel = m.idx === idx;
    m.leaflet.setIcon(makeIcon(color, sel));
    if (sel) m.leaflet.openPopup();
  });

  var item = d.items[idx];
  if (item && item.lat) {
    map.flyTo([item.lat, item.lng], Math.max(map.getZoom(), 17), { duration: 0.55 });
  }
}

function clearRouteLine() {
  if (routeLine) {
    map.removeLayer(routeLine);
    routeLine = null;
  }
}

function updateRouteLine() {
  clearRouteLine();
  if (!routeEnabled || !lastGeoPos || currentIdx === null) return;

  var item = DAYS[currentDay].items[currentIdx];
  if (!item || !item.lat || !item.lng) return;

  routeLine = L.polyline([lastGeoPos, [item.lat, item.lng]], {
    color: '#1a73e8',
    weight: 3,
    opacity: 0.78,
    dashArray: '7 8',
    lineCap: 'round',
    interactive: false
  }).addTo(map);
}

function toggleRoute() {
  routeEnabled = !routeEnabled;
  var btn = document.getElementById('btn-route');
  if (btn) {
    btn.className = 'map-btn' + (routeEnabled ? ' active-route' : '');
    btn.title = routeEnabled ? 'Hide route line' : 'Show route to selected stop';
  }
  updateRouteLine();
}

function setMapMode(mode, keepSelection) {
  mapMode = mode;
  var btnAll  = document.getElementById('btn-all');
  var btnFood = document.getElementById('btn-food');
  btnAll.className  = 'map-btn' + (mode === 'all'  ? ' active-all'  : '');
  btnFood.className = 'map-btn' + (mode === 'food' ? ' active-food' : '');

  // reset selection when switching view
  if (!keepSelection) {
    currentIdx = null;
    document.querySelectorAll('.t-item').forEach(function(el){ el.classList.remove('selected'); });
    closeSheet();
  }
  renderMarkers(currentDay);
  updateRouteLine();

  // zoom to fit food markers if food mode
  if (mode === 'food' && allMarkers.length > 0) {
    var lats = [], lngs = [];
    allMarkers.forEach(function(m){
      lats.push(m.leaflet.getLatLng().lat);
      lngs.push(m.leaflet.getLatLng().lng);
    });
    var bounds = L.latLngBounds(
      [Math.min.apply(null,lats)-0.002, Math.min.apply(null,lngs)-0.003],
      [Math.max.apply(null,lats)+0.002, Math.max.apply(null,lngs)+0.003]
    );
    map.flyToBounds(bounds, { duration: 0.6, padding: [20,20] });
  } else {
    map.flyTo(DAYS[currentDay].center, DAYS[currentDay].zoom, { duration: 0.6 });
  }
}

// ─── STATS ────────────────────────────────────────────────────────────────────
function renderStats(day) {
  var cls = day === 'dl' ? 'dl' : 'dca';
  document.getElementById('stats-bar').innerHTML = DAYS[day].stats.map(function(s){
    return '<div class="stat-cell '+cls+'"><div class="num">'+s.num+'</div><div class="lbl">'+s.lbl+'</div></div>';
  }).join('');
}

// ─── BADGE ────────────────────────────────────────────────────────────────────
function badgeCls(b) {
  var bl = b.toLowerCase();
  if (bl.includes('multi'))   return 'multi';
  if (bl.includes('standby')) return 'standby';
  if (bl.includes('vegan'))   return 'vegan';
  return 'wait';
}

// ─── TIMELINE ────────────────────────────────────────────────────────────────
function renderTimeline(day) {
  var html = '';
  DAYS[day].items.forEach(function(item, idx){
    if (item.section) html += '<div class="section-label">'+item.section+'</div>';
    var badges = (item.badges||[]).map(function(b){ return '<span class="badge '+badgeCls(b)+'">'+b+'</span>'; }).join('');
    html += '<div class="t-item" onclick="selectItem('+idx+')" data-idx="'+idx+'">' +
      '<div class="t-time">'+item.time+'</div>' +
      '<div class="t-spine"><div class="t-dot '+item.type+'"></div><div class="t-line"></div></div>' +
      '<div class="t-body"><div class="t-title">'+item.title+badges+'</div><span class="t-chevron">&#8250;</span></div>' +
      '</div>';
  });
  document.getElementById('timeline').innerHTML = html;
}

// ─── DETAIL ───────────────────────────────────────────────────────────────────
function buildDetail(day, idx) {
  var item = DAYS[day].items[idx];
  var typeLabel =
    item.type==='multi'   ? '&#9889; Lightning Lane Multi Pass' :
    item.type==='standby' ? '&#128694; Standby' :
    item.type==='food'    ? '&#127807; Food Stop' : '&#128161; Strategy Note';

  var cc = 'detail-card';
  if (item.type==='multi') cc += ' type-multi '+day;
  if (item.type==='food')  cc += ' type-food';

  var badges = (item.badges||[]).filter(Boolean).map(function(b){
    return '<span class="badge '+badgeCls(b)+'">'+b+'</span>';
  }).join('');

  var mpBox = '';
  if (item.mp_next && item.mp_next !== false) {
    mpBox = '<div class="mp-next-box">&#9889; ' + item.mp_next + '</div>';
  }

  var meta = [];
  if (item.land_label) meta.push('<div class="detail-meta-cell"><div class="label">Location</div><div class="value">'+item.land_label+'</div></div>');
  if (item.wait)       meta.push('<div class="detail-meta-cell"><div class="label">Wait times</div><div class="value">'+item.wait+'</div></div>');
  if (item.solo===true)  meta.push('<div class="detail-meta-cell"><div class="label">Single Rider</div><div class="value">&#10003; Available</div></div>');
  if (item.solo===false) meta.push('<div class="detail-meta-cell"><div class="label">Single Rider</div><div class="value">&#10007; Not available</div></div>');

  return '<div class="'+cc+'">'+
    '<div class="detail-eyebrow">'+typeLabel+' &middot; '+item.time+'</div>'+
    '<h2 class="detail-title">'+item.title+'</h2>'+
    (badges ? '<div class="detail-badges">'+badges+'</div>' : '')+
    '<div class="detail-desc">'+item.desc+mpBox+'</div>'+
    (meta.length ? '<div class="detail-meta">'+meta.join('')+'</div>' : '')+
    '</div>';
}

// ─── SELECT ───────────────────────────────────────────────────────────────────
function selectItem(idx) {
  document.querySelectorAll('.t-item').forEach(function(el,i){
    el.classList.toggle('selected', i===idx);
  });
  currentIdx = idx;
  checkMobile();

  var html = buildDetail(currentDay, idx);

  if (isMobile) {
    document.getElementById('sheet-body').innerHTML = html;
    document.getElementById('detail-sheet').classList.add('open');
    document.getElementById('sheet-backdrop').classList.add('visible');
  } else {
    document.getElementById('detail-panel').innerHTML = html;
  }

  // only update markers if in 'all' mode (food mode has filtered set)
  if (mapMode === 'all') {
    highlightMarker(idx);
  } else if (DAYS[currentDay].items[idx].type === 'food') {
    highlightMarker(idx);
  } else {
    // item not on map in food mode — just fly to area
    var item = DAYS[currentDay].items[idx];
    if (item.lat) map.flyTo([item.lat, item.lng], 17, { duration: 0.55 });
  }
  updateRouteLine();
}

function closeSheet() {
  document.getElementById('detail-sheet').classList.remove('open');
  document.getElementById('sheet-backdrop').classList.remove('visible');
}

// ─── SWITCH DAY ───────────────────────────────────────────────────────────────
function switchDay(day) {
  currentView = 'day';
  currentDay = day;
  currentIdx = null;
  mapMode = 'all';
  hideFoodGuide();
  document.getElementById('tab-dl').className  = 'day-tab'+(day==='dl'  ? ' active-dl'  : '');
  document.getElementById('tab-dca').className = 'day-tab'+(day==='dca' ? ' active-dca' : '');
  document.getElementById('tab-food').className = 'day-tab';
  document.getElementById('btn-all').className  = 'map-btn active-all';
  document.getElementById('btn-food').className = 'map-btn';
  renderStats(day);
  renderTimeline(day);
  closeSheet();
  document.querySelectorAll('.t-item').forEach(function(el){ el.classList.remove('selected'); });
  document.getElementById('detail-panel').innerHTML = '';
  renderMarkers(day);
  updateRouteLine();
  map.flyTo(DAYS[day].center, DAYS[day].zoom, { duration: 0.7 });
  setTimeout(fitTimeline, 50);
}

function switchFoodView() {
  currentView = 'food';
  currentIdx = null;
  closeSheet();
  document.getElementById('tab-dl').className = 'day-tab';
  document.getElementById('tab-dca').className = 'day-tab';
  document.getElementById('tab-food').className = 'day-tab active-food';
  showFoodGuide(foodGuidePark || currentDay);
  updateRouteLine();
}

// ─── DYNAMIC TIMELINE HEIGHT ──────────────────────────────────────────────────
// Measures every sibling above the timeline and fills remaining viewport height.
function fitTimeline() {
  if (!isMobile) return;
  var tl = document.getElementById('timeline');
  if (!tl) return;

  var viewH  = window.innerHeight;
  var rect   = tl.getBoundingClientRect();
  var topOfTimeline = rect.top + window.scrollY; // distance from page top
  // Available = viewport height minus where timeline starts minus a small bottom gap
  var available = viewH - topOfTimeline - 4;
  // Clamp: never smaller than 3 rows (~120px), never taller than 70vh
  available = Math.max(available, 120);
  available = Math.min(available, Math.round(viewH * 0.70));
  tl.style.maxHeight = available + 'px';
  tl.style.height    = available + 'px';
}

// ─── GEOLOCATION ──────────────────────────────────────────────────────────────
var geoLayer   = null;   // L.LayerGroup holding the dot + ring
var geoWatchId = null;
var lastGeoPos = null;

function startGeolocation() {
  if (!navigator.geolocation) return;

  geoLayer = L.layerGroup().addTo(map);

  geoWatchId = navigator.geolocation.watchPosition(
    function(pos) {
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      lastGeoPos = [lat, lng];
      renderGeoDot(lat, lng, pos.coords.accuracy);
      updateRouteLine();
    },
    function() { /* silently ignore errors / denials */ },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
  );
}

function renderGeoDot(lat, lng, accuracy) {
  if (!geoLayer) return;
  geoLayer.clearLayers();

  // Accuracy circle (faint)
  if (accuracy && accuracy < 300) {
    L.circle([lat, lng], {
      radius: accuracy,
      color: '#1a73e8', fillColor: '#1a73e8',
      fillOpacity: 0.08, weight: 1, opacity: 0.3
    }).addTo(geoLayer);
  }

  // Outer pulsing ring — CSS animation via a divIcon
  L.marker([lat, lng], {
    icon: L.divIcon({
      className: '',
      html: '<div class="geo-pulse"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    }),
    interactive: false,
    zIndexOffset: 500
  }).addTo(geoLayer);

  // Inner solid dot
  L.marker([lat, lng], {
    icon: L.divIcon({
      className: '',
      html: '<div class="geo-dot"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    }),
    interactive: false,
    zIndexOffset: 600
  }).addTo(geoLayer);
}

function locateMe() {
  if (!navigator.geolocation) return;
  var btn = document.getElementById('btn-locate');
  if (btn) { btn.textContent = '…'; btn.style.opacity = '0.6'; }

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      lastGeoPos = [lat, lng];
      renderGeoDot(lat, lng, pos.coords.accuracy);
      updateRouteLine();
      map.flyTo([lat, lng], Math.max(map.getZoom(), 17), { duration: 0.6 });
      if (btn) { btn.textContent = '📍'; btn.style.opacity = '1'; }
    },
    function() {
      if (btn) { btn.textContent = '📍'; btn.style.opacity = '1'; }
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

// ─── FOOD GUIDE STATE ─────────────────────────────────────────────────────────
var foodGuideOpen = false;
var foodGuidePark = 'dl';

function showFoodGuide(park) {
  foodGuideOpen = true;
  foodGuidePark = park || currentDay;
  // Hide timeline, show food guide in sidebar — map stays visible above
  document.getElementById('timeline').style.display = 'none';
  document.getElementById('stats-bar').style.display = 'none';
  var wrap = document.getElementById('food-guide-wrap');
  wrap.style.display = 'flex';
  wrap.innerHTML = buildFoodGuideHTML(foodGuidePark);
  // Clear detail panel on desktop since food guide is now in sidebar
  var dp = document.getElementById('detail-panel');
  if (dp) dp.innerHTML = '<div class="detail-empty"><div class="detail-empty-icon">&#127807;</div><p>Select a venue from the food guide to see details, or tap a map pin.</p></div>';
  if (map) setTimeout(function(){ map.invalidateSize(); }, 50);
}

function hideFoodGuide() {
  foodGuideOpen = false;
  document.getElementById('timeline').style.display = '';
  document.getElementById('stats-bar').style.display = '';
  document.getElementById('food-guide-wrap').style.display = 'none';
  document.getElementById('food-guide-wrap').innerHTML = '';
  if (map) setTimeout(function(){ map.invalidateSize(); }, 50);
}

function switchFoodPark(park) {
  foodGuidePark = park;
  currentDay = park;
  document.getElementById('food-guide-wrap').innerHTML = buildFoodGuideHTML(park);
  renderMarkers(park);
  map.flyTo(DAYS[park].center, DAYS[park].zoom, { duration: 0.6 });
}

function buildFoodGuideHTML(park) {
  var data = FOOD_GUIDE[park];
  var html = '';

  html += '<div class="food-guide-header">' +
    '<h2>&#127807; Complete Food Guide <span class="food-guide-badge">50+ vegan items</span></h2>' +
    '<div class="food-guide-sub">All confirmed plant-based options &middot; updated Jan 2026 &middot; always verify &#127807; green leaf icon in-app</div>' +
  '</div>';

  html += '<div class="food-park-tabs">' +
    '<button class="fp-tab ' + (park==='dl' ? 'active-dl' : '') + '" onclick="switchFoodPark(&quot;dl&quot;)">&#127984; Disneyland Park</button>' +
    '<button class="fp-tab ' + (park==='dca' ? 'active-dca' : '') + '" onclick="switchFoodPark(&quot;dca&quot;)">&#127905; Disney California Adventure</button>' +
  '</div>';

  html += '<div class="food-guide-scroll"><div class="fg-park-block">';
  html += '<div class="fg-park-title ' + data.cls + '">' + (park==='dl' ? '&#127984;' : '&#127905;') + ' ' + data.label + '</div>';

  data.lands.forEach(function(land, li) {
    html += '<div class="fg-land"><div class="fg-land-name">' + land.name + '</div>';
    land.venues.forEach(function(venue, vi) {
      var vid = 'fg-v-' + park + '-' + li + '-' + vi;
      html += '<div class="fg-venue" id="' + vid + '">';
      html += '<div class="fg-venue-hdr" onclick="fgToggle(&quot;' + vid + '&quot;)">' +
        '<span class="fg-venue-name">' + venue.name + '</span>' +
        '<div class="fg-venue-right">' +
          '<span class="fg-venue-type">' + venue.type + '</span>' +
          '<span class="fg-chevron">&#9660;</span>' +
        '</div>' +
      '</div>';
      html += '<div class="fg-items">';
      if (venue.items && venue.items.length > 0) {
        venue.items.forEach(function(item) {
          html += '<div class="fg-item"><span class="fg-leaf">&#127807;</span><div class="fg-item-body">' +
            '<div class="fg-item-name">' + item.name +
              (item.isNew ? '<span class="tag-new">NEW Jan 2026</span>' : '') +
              (item.sellout ? '<span class="tag-out">Sells out early</span>' : '') +
              (item.price ? '<span class="fg-price">' + item.price + '</span>' : '') +
            '</div>' +
            '<div class="fg-item-desc">' + item.desc + '</div>' +
          '</div></div>';
        });
      }
      if (venue.note) {
        html += '<div class="fg-venue-note">' + venue.note + '</div>';
      }
      html += '</div></div>';
    });
    html += '</div>';
  });

  html += '</div></div>';
  return html;
}

function fgToggle(id) {
  var el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function(){
  checkMobile();
  renderStats('dl');
  renderTimeline('dl');
  setTimeout(function(){
    initMap();
    // Start geolocation after map ready (small extra delay for tile load)
    setTimeout(startGeolocation, 400);
  }, 100);
  // Fit timeline after layout settles
  setTimeout(fitTimeline, 200);
});

window.addEventListener('resize', function(){
  checkMobile();
  if (map) map.invalidateSize();
  fitTimeline();
});

// Also refit when orientation changes (common on mobile)
window.addEventListener('orientationchange', function(){
  setTimeout(function(){
    if (map) map.invalidateSize();
    fitTimeline();
  }, 300);
});

// ─── RESIZE HANDLES ───────────────────────────────────────────────────────────
(function() {
  // ── Horizontal (sidebar width) ──────────────────────────────────────────────
  var rh = document.getElementById('resize-h');
  var sidebar = document.querySelector('.sidebar');
  var draggingH = false, startXH, startWH;

  rh.addEventListener('mousedown', function(e) {
    draggingH = true;
    startXH = e.clientX;
    startWH = sidebar.offsetWidth;
    rh.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!draggingH) return;
    var newW = Math.min(Math.max(startWH + (e.clientX - startXH), 200), window.innerWidth * 0.7);
    sidebar.style.width = newW + 'px';
    if (map) map.invalidateSize();
  });

  document.addEventListener('mouseup', function() {
    if (!draggingH) return;
    draggingH = false;
    rh.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    if (map) map.invalidateSize();
  });

  // Touch support for horizontal
  rh.addEventListener('touchstart', function(e) {
    draggingH = true;
    startXH = e.touches[0].clientX;
    startWH = sidebar.offsetWidth;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', function(e) {
    if (!draggingH) return;
    var newW = Math.min(Math.max(startWH + (e.touches[0].clientX - startXH), 200), window.innerWidth * 0.7);
    sidebar.style.width = newW + 'px';
    if (map) map.invalidateSize();
  }, { passive: false });
  document.addEventListener('touchend', function() {
    draggingH = false;
    if (map) map.invalidateSize();
  });

  // ── Vertical (map height) ───────────────────────────────────────────────────
  var rv = document.getElementById('resize-v');
  var mapEl = document.getElementById('map');
  var draggingV = false, startYV, startHV;

  rv.addEventListener('mousedown', function(e) {
    draggingV = true;
    startYV = e.clientY;
    startHV = mapEl.offsetHeight;
    rv.classList.add('dragging');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!draggingV) return;
    var sidebarH = sidebar.offsetHeight;
    var minH = 80, maxH = sidebarH - 120;
    var newH = Math.min(Math.max(startHV + (e.clientY - startYV), minH), maxH);
    mapEl.style.height = newH + 'px';
    if (map) map.invalidateSize();
    fitTimeline();
  });

  document.addEventListener('mouseup', function() {
    if (!draggingV) return;
    draggingV = false;
    rv.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    if (map) map.invalidateSize();
  });

  // Touch support for vertical
  rv.addEventListener('touchstart', function(e) {
    draggingV = true;
    startYV = e.touches[0].clientY;
    startHV = mapEl.offsetHeight;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', function(e) {
    if (!draggingV) return;
    var sidebarH = sidebar.offsetHeight;
    var newH = Math.min(Math.max(startHV + (e.touches[0].clientY - startYV), 80), sidebarH - 120);
    mapEl.style.height = newH + 'px';
    if (map) map.invalidateSize();
    fitTimeline();
  }, { passive: false });
  document.addEventListener('touchend', function() {
    draggingV = false;
    if (map) map.invalidateSize();
  });
})();

</script>
